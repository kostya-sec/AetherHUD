[package]
name = "aetherhud"
description = "AetherHUD desktop HUD shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aetherhud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
aether-core = { path = "../crates/aether-core" }
tauri = { version = "2.12.1", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }

[dev-dependencies]
fastrand = { workspace = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSEvent",
  "NSRunningApplication",
  "NSScreen",
  "NSWindow",
  "NSWorkspace",
] }
